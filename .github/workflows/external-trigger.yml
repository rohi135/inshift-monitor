name: External Trigger

# این workflow با درخواست HTTP از cron-job.org اجرا می‌شه
# Shift Monitor رو اول اجرا می‌کنه، بعد ۳۰ ثانیه صبر می‌کنه، بعد Telegram Bot رو

on:
  repository_dispatch:
    types: [trigger-monitor]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🚀 Trigger Shift Monitor
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          echo "🚀 Triggering Shift Monitor..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/monitor.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "  HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "204" ]; then
            echo "  ✓ Shift Monitor triggered successfully"
          else
            echo "  ✗ Failed to trigger Shift Monitor"
          fi

      - name: ⏳ Wait 30 seconds
        run: |
          echo "⏳ Waiting 30 seconds for Shift Monitor to start..."
          sleep 30

      - name: 🤖 Trigger Telegram Bot
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          echo "🤖 Triggering Telegram Bot..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/telegram-bot.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "  HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "204" ]; then
            echo "  ✓ Telegram Bot triggered successfully"
          else
            echo "  ✗ Failed to trigger Telegram Bot"
          fi

      - name: 📊 Summary
        if: always()
        run: |
          echo "## External Trigger Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Shift Monitor triggered" >> $GITHUB_STEP_SUMMARY
          echo "✅ Telegram Bot triggered (30s later)" >> $GITHUB_STEP_SUMMARY
