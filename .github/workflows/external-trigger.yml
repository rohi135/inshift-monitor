name: External Trigger

# این workflow با درخواست HTTP از cron-job.org اجرا می‌شه
# فقط Shift Monitor رو trigger می‌کنه
# Telegram Bot خودکار بعد از تموم شدن Shift Monitor اجرا می‌شه (با workflow_run event)

on:
  repository_dispatch:
    types: [trigger-monitor]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: 🚀 Trigger Shift Monitor
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          echo "🚀 Triggering Shift Monitor..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/monitor.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "  HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" = "204" ]; then
            echo "  ✓ Shift Monitor triggered successfully"
            echo "  → Telegram Bot will start automatically when Shift Monitor completes"
          else
            echo "  ✗ Failed to trigger Shift Monitor"
          fi

      - name: 📊 Summary
        if: always()
        run: |
          echo "## External Trigger Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Shift Monitor triggered" >> $GITHUB_STEP_SUMMARY
          echo "⏳ Telegram Bot will auto-start when Shift Monitor finishes" >> $GITHUB_STEP_SUMMARY
