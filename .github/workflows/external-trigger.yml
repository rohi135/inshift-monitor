name: External Trigger

# این workflow با درخواست HTTP از cron-job.org (یا هر سرویس خارجی) اجرا می‌شه
# اگه ساعت آخر اجرای هر کدوم از workflowها بیش از حد گذشته باشه، triggerشون می‌کنه

on:
  repository_dispatch:
    types: [trigger-monitor]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🕐 Check last runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          check_workflow() {
            local workflow_name="$1"
            local threshold_min="$2"

            echo "Checking $workflow_name (threshold: ${threshold_min} min)..."

            LAST_RUN=$(curl -s -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/${workflow_name}/runs?status=completed&per_page=10" \
              | python3 -c "
          import sys, json
          from datetime import datetime, timezone
          d = json.load(sys.stdin)
          for run in d.get('workflow_runs', []):
              if run.get('conclusion') == 'success':
                  created = datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
                  now = datetime.now(timezone.utc)
                  diff_min = (now - created).total_seconds() / 60
                  print(f'{int(diff_min)}')
                  return
          print('')
          ")

            echo "  Last success: ${LAST_RUN:-never} minutes ago"

            if [ -z "$LAST_RUN" ] || [ "$LAST_RUN" -gt "$threshold_min" ]; then
              echo "  → Should trigger: yes"
              echo "should_trigger_${workflow_name}=true" >> $GITHUB_OUTPUT
            else
              echo "  → Should trigger: no (recent run exists)"
              echo "should_trigger_${workflow_name}=false" >> $GITHUB_OUTPUT
            fi
          }

          # Shift Monitor: threshold 35 min (هر ۳۰ دقیقه باید اجرا بشه)
          check_workflow "monitor.yml" 35

          # Telegram Bot: threshold 20 min (هر ۱۵ دقیقه باید اجرا بشه)
          check_workflow "telegram-bot.yml" 20

      - name: 🚀 Trigger Shift Monitor
        if: steps.check.outputs.should_trigger_monitor_yml == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🚀 Triggering Shift Monitor..."
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/monitor.yml/dispatches" \
            -d '{"ref":"main"}' \
            -w "HTTP Status: %{http_code}\n"

      - name: 🤖 Trigger Telegram Bot
        if: steps.check.outputs.should_trigger_telegram-bot_yml == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🤖 Triggering Telegram Bot..."
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/telegram-bot.yml/dispatches" \
            -d '{"ref":"main"}' \
            -w "HTTP Status: %{http_code}\n"

      - name: 📊 Summary
        run: |
          echo "## External Trigger Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Workflow | Should Trigger |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Shift Monitor | ${{ steps.check.outputs.should_trigger_monitor_yml }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Telegram Bot | ${{ steps.check.outputs.should_trigger_telegram-bot_yml }} |" >> $GITHUB_STEP_SUMMARY
