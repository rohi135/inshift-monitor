name: Telegram Bot

# این workflow هر ۱۵ دقیقه اجرا می‌شه
# پیام‌های جدید تلگرام رو چک می‌کنه
# اگه توکن JWT فرستاده باشی، خودکار در GitHub Secret ذخیره می‌کنه

on:
  schedule:
    # هر ۱۵ دقیقه (بهینه برای جلوگیری از delay و rate limit)
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 Run Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTAL_TOKEN: ${{ secrets.INSHIFT_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python run_bot.py

      - name: 💾 Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No bot state changes."
          else
            git commit -m "chore: update bot state [skip ci]"
            git push
          fi
