name: Telegram Bot

# این workflow خودکار بعد از تموم شدن Shift Monitor اجرا می‌شه
# همچنین می‌تونی دستی هم اجرا کنی

on:
  workflow_run:
    workflows: ["Shift Monitor"]
    types: [completed]
  workflow_dispatch:  # اجرای دستی

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # فقط اگه Shift Monitor موفق بوده اجرا بشه (نه fail)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🤖 Run Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTAL_TOKEN: ${{ secrets.INSHIFT_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python run_bot.py

      - name: 💾 Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No bot state changes."
          else
            git commit -m "chore: update bot state [skip ci]"
            git pull --rebase origin main || true
            git push || echo "Push failed, will retry next run"
          fi
