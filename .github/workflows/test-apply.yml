name: Test Apply Shift

# این workflow فقط برای تست ثبت درخواست یه شیفت خاص هست

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Test apply for specific shift
        env:
          INSHIFT_TOKEN: ${{ secrets.INSHIFT_TOKEN }}
          API_URL: ${{ secrets.API_URL }}
          PORTAL_ORIGIN: ${{ secrets.PORTAL_ORIGIN }}
        run: |
          python -c "
          import os, sys, json, requests, asyncio
          sys.path.insert(0, '.')

          TOKEN = os.getenv('INSHIFT_TOKEN')
          API_URL = os.getenv('API_URL', '')
          PORTAL_ORIGIN = os.getenv('PORTAL_ORIGIN', '')
          TEST_HASH_ID = '208118679081'

          print(f'=' * 60)
          print(f'🧪 TEST: Apply for shift {TEST_HASH_ID}')
          print(f'=' * 60)

          from proxy_pool import ProxyPool
          from urllib.parse import urlparse

          async def test():
              pool = ProxyPool(refresh_interval_minutes=60)
              await pool.initialize(lazy=True)
              print(f'✓ Pool ready with {len(pool.proxies)} proxies')

              parsed = urlparse(API_URL)
              base_url = f'{parsed.scheme}://{parsed.netloc}'
              apply_url = base_url + '/api/seeker/v1/jobs'

              headers = {
                  'Authorization': TOKEN,
                  'Accept': 'application/json, text/plain, */*',
                  'Accept-Language': 'en-US,en;q=0.9',
                  'Content-Type': 'application/json',
                  'Origin': PORTAL_ORIGIN,
                  'Referer': PORTAL_ORIGIN + '/',
                  'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:155.0) Gecko/20100101 Firefox/155.0',
                  'Sec-Fetch-Dest': 'empty',
                  'Sec-Fetch-Mode': 'cors',
                  'Sec-Fetch-Site': 'same-site',
              }

              body = {'job_post_id': TEST_HASH_ID}

              print(f'\\n📝 Sending POST to: {apply_url}')
              print(f'📦 Body: {json.dumps(body, ensure_ascii=False)}')
              print(f'🌐 Origin: {PORTAL_ORIGIN}')

              for i, proxy in enumerate(pool.proxies[:10]):
                  print(f'\\n--- Attempt {i+1}: {proxy.url} ---')
                  try:
                      response = requests.post(
                          apply_url,
                          headers=headers,
                          json=body,
                          proxies={'http': proxy.url, 'https': proxy.url},
                          timeout=15,
                          verify=True
                      )
                      print(f'HTTP Status: {response.status_code}')
                      print(f'Response: {response.text}')

                      if response.status_code in (200, 400, 401, 403, 404, 422):
                          print(f'\\n{\"=\"*60}')
                          if response.status_code == 200:
                              data = response.json()
                              print(f'🎉 SUCCESS: {data.get(\"message\", \"موفق\")}')
                          elif response.status_code == 422:
                              data = response.json()
                              if 'duplicate' in str(data).lower():
                                  print('✅ Already applied - API works!')
                              else:
                                  print(f'⚠️ Validation: {data}')
                          elif response.status_code == 401:
                              print('❌ Token expired')
                          else:
                              print(f'❌ HTTP {response.status_code}')
                          return
                  except Exception as e:
                      print(f'✗ Error: {e}')

          asyncio.run(test())
          "