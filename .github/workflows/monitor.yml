name: Shift Monitor

# این workflow هر ۳۰ دقیقه اجرا می‌شه
# همچنین می‌تونی دستی هم اجرا کنی

on:
  schedule:
    # هر ۳۰ دقیقه (UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch:  # اجرای دستی از GitHub UI

# اجازه commit کردن state.json
permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📝 Create token.txt from secret
        env:
          PORTAL_TOKEN: ${{ secrets.INSHIFT_TOKEN }}
        run: |
          if [ -n "$PORTAL_TOKEN" ]; then
            echo "$PORTAL_TOKEN" > token.txt
            echo "✓ token.txt created from secret"
          else
            echo "⚠️  INSHIFT_TOKEN secret is not set"
            touch token.txt
          fi

      - name: 🚀 Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PORTAL_TOKEN: ${{ secrets.INSHIFT_TOKEN }}
          API_URL: ${{ secrets.API_URL }}
          PORTAL_ORIGIN: ${{ secrets.PORTAL_ORIGIN }}
          FILTER_JOB_TITLES: ${{ vars.FILTER_JOB_TITLES || 'Stow,Pick' }}
          FILTER_LOCATION: ${{ vars.FILTER_LOCATION || 'دانش' }}
          FILTER_START_HOUR: ${{ vars.FILTER_START_HOUR || '7' }}
          FILTER_START_MINUTE: ${{ vars.FILTER_START_MINUTE || '0' }}
          FILTER_END_HOUR: ${{ vars.FILTER_END_HOUR || '17' }}
          FILTER_END_MINUTE: ${{ vars.FILTER_END_MINUTE || '0' }}
          EXCLUDE_FULL_CAPACITY: ${{ vars.EXCLUDE_FULL_CAPACITY || 'true' }}
        run: |
          python run_monitor.py

      - name: 💾 Commit state
        # state.json رو به ریپو commit می‌کنه تا بین runها حفظ بشه
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update state [skip ci]"
            git push
            echo "✓ State committed and pushed."
          fi

      - name: 📊 Show summary
        if: always()
        run: |
          echo "## Monitor Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**زمان:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f state.json ]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat state.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No state file generated." >> $GITHUB_STEP_SUMMARY
          fi
